name: test-suite

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unittest-discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
