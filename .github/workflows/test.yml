name: test-suite

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unittest-discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  interface-mac-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise duplicate link-local addresses on separate links
        run: scripts/test-mac-integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-mac-evidence
          path: mac-test-artifacts/
